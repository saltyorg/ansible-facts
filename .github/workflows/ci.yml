name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_call:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Every other run has a group of
# its own, so pushes, scheduled runs and releases never wait or cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stable:
    name: Stable Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run debug tests
        run: cargo test --all-targets --all-features --locked

      - name: Run release tests
        run: cargo test --release --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read minimum Rust version
        id: rust_version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          version = manifest["package"]["rust-version"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){0,2}", version):
              raise SystemExit("package.rust-version must be a numeric Rust version")
          toolchain = ".".join((version.split(".") + ["0", "0"])[:3])
          print(f"toolchain={toolchain}")
          PY

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.rust_version.outputs.toolchain }}

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          # renovate: datasource=crate depName=cargo-deny
          tool: cargo-deny@0.20.2

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
      ZIZMOR_VERSION: 1.32.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint with ShellCheck
        uses: saltyorg/github-actions/jactionlint@v1.5.0

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            --env GH_TOKEN \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            "ghcr.io/zizmorcore/zizmor:${ZIZMOR_VERSION}" \
            --format github \
            .
