name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

# A release in progress is never cancelled; a repeated run for the same ref waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    strategy:
      matrix:
        include:
          # Linux x86_64 (MUSL - static binary)
          - target: x86_64-unknown-linux-musl
            arch: amd64

          # Linux ARM64 (MUSL - static binary)
          - target: aarch64-unknown-linux-musl
            arch: arm64

          # Linux ARM v7 (MUSL - static binary)
          - target: armv7-unknown-linux-musleabihf
            arch: armv7

          # Linux ARM v6 (MUSL - static binary)
          - target: arm-unknown-linux-musleabihf
            arch: armv6

          # Linux ARM v5 (MUSL - static binary)
          - target: armv5te-unknown-linux-musleabi
            arch: armv5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate architecture label
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          case "${ARCH}:${TARGET}" in
            amd64:x86_64-unknown-linux-musl | \
            arm64:aarch64-unknown-linux-musl | \
            armv7:armv7-unknown-linux-musleabihf | \
            armv6:arm-unknown-linux-musleabihf | \
            armv5:armv5te-unknown-linux-musleabi)
              ;;
            *)
              echo "Architecture label '${ARCH}' does not match target '${TARGET}'." >&2
              exit 1
              ;;
          esac

      - name: Set version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="$REF_NAME"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag does not contain a valid semantic version: $REF_NAME" >&2
              exit 1
            fi
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "Setting version to: $VERSION"
          else
            # For workflow_dispatch, use a default or current date-based version
            VERSION="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "No tag found, using dev version: $VERSION"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Synchronize package version
        run: |
          sed -i "s/^version = \".*\"$/version = \"${VERSION}\"/" Cargo.toml
          cargo update -p saltbox-facts --precise "${VERSION}"
          cargo metadata --locked --format-version 1 >/dev/null
          echo "Updated root Cargo.toml version:"
          grep '^version = ' Cargo.toml

      - name: Install cross
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          # Keep in step with the ghcr.io/cross-rs images used below.
          tool: cross@0.2.5
          fallback: none

      - name: Build Release Binary
        # Keep this cross-build workaround scoped to release artifacts instead
        # of disabling AWS-LC CPU jitter entropy for native developer/CI builds.
        env:
          AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
          CROSS_BUILD_ENV_PASSTHROUGH: AWS_LC_SYS_NO_JITTER_ENTROPY
          TARGET: ${{ matrix.target }}
        run: cross build --release --locked --target "${TARGET}"

      - name: Validate ARMv5 runtime compatibility
        if: matrix.arch == 'armv5'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          fact_binary="${GITHUB_WORKSPACE}/target/${TARGET}/release/saltbox-facts"
          version_output="$(
            docker run --rm \
              --entrypoint sh \
              --volume "${fact_binary}:/tmp/saltbox-facts:ro" \
              "ghcr.io/cross-rs/${TARGET}:0.2.5" \
              -lc 'qemu-arm -cpu arm926 /tmp/saltbox-facts --version'
          )"
          if [ "$version_output" != "$VERSION" ]; then
            echo "ARMv5 runtime check emitted version '${version_output}', expected '${VERSION}'." >&2
            exit 1
          fi
          output="$(
            docker run --rm \
              --entrypoint sh \
              --volume "${fact_binary}:/tmp/saltbox-facts:ro" \
              "ghcr.io/cross-rs/${TARGET}:0.2.5" \
              -lc 'qemu-arm -cpu arm926 /tmp/saltbox-facts'
          )"
          case "$output" in
            *'"ip":'*) ;;
            *)
              echo "ARMv5 runtime check did not emit the IP fact." >&2
              exit 1
              ;;
          esac

      - name: Prepare binary
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: mv "target/${TARGET}/release/saltbox-facts" "target/${TARGET}/release/saltbox-facts-${ARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saltbox-facts-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/saltbox-facts-${{ matrix.arch }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # create the GitHub release and upload its binaries

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: saltbox-facts-*
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          # Move all binaries to release directory
          for dir in artifacts/saltbox-facts-*; do
            if [ -d "$dir" ]; then
              mv "$dir"/* release/
            fi
          done

          # Create legacy name for amd64 if it exists
          if [ -f "release/saltbox-facts-amd64" ]; then
            cp release/saltbox-facts-amd64 release/saltbox-facts
            echo "Created legacy binary: saltbox-facts"
          fi

          # List files for verification
          echo "Release files:"
          ls -lh release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes "" release/*

  security:
    name: Sync advisory issues
    needs: release
    permissions:
      contents: read
      issues: write # open, annotate and close advisory issues
    uses: ./.github/workflows/security.yml
