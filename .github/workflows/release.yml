name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        include:
          # Linux x86_64 (MUSL - static binary)
          - target: x86_64-unknown-linux-musl
            arch: amd64

          # Linux ARM64 (MUSL - static binary)
          - target: aarch64-unknown-linux-musl
            arch: arm64

          # Linux ARM v7 (MUSL - static binary)
          - target: armv7-unknown-linux-musleabihf
            arch: armv7

          # Linux ARM v6 (MUSL - static binary)
          - target: arm-unknown-linux-musleabihf
            arch: armv6

          # Linux ARM v5 (MUSL - static binary)
          - target: armv5te-unknown-linux-musleabi
            arch: armv5

    steps:
      - uses: actions/checkout@v7

      - name: Validate architecture label
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          case "${ARCH}:${TARGET}" in
            amd64:x86_64-unknown-linux-musl | \
            arm64:aarch64-unknown-linux-musl | \
            armv7:armv7-unknown-linux-musleabihf | \
            armv6:arm-unknown-linux-musleabihf | \
            armv5:armv5te-unknown-linux-musleabi)
              ;;
            *)
              echo "Architecture label '${ARCH}' does not match target '${TARGET}'." >&2
              exit 1
              ;;
          esac

      - name: Set version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="$REF_NAME"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag does not contain a valid semantic version: $REF_NAME" >&2
              exit 1
            fi
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "Setting version to: $VERSION"
          else
            # For workflow_dispatch, use a default or current date-based version
            VERSION="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "No tag found, using dev version: $VERSION"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Synchronize package version
        run: |
          sed -i "s/^version = \".*\"$/version = \"${VERSION}\"/" Cargo.toml
          cargo update -p saltbox-facts --precise "${VERSION}"
          cargo metadata --locked --format-version 1 >/dev/null
          echo "Updated root Cargo.toml version:"
          grep '^version = ' Cargo.toml

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build Release Binary
        # Keep this cross-build workaround scoped to release artifacts instead
        # of disabling AWS-LC CPU jitter entropy for native developer/CI builds.
        env:
          AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
          CROSS_BUILD_ENV_PASSTHROUGH: AWS_LC_SYS_NO_JITTER_ENTROPY
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Validate ARMv5 runtime compatibility
        if: matrix.arch == 'armv5'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          fact_binary="${GITHUB_WORKSPACE}/target/${TARGET}/release/saltbox-facts"
          version_output="$(
            docker run --rm \
              --entrypoint sh \
              --volume "${fact_binary}:/tmp/saltbox-facts:ro" \
              "ghcr.io/cross-rs/${TARGET}:0.2.5" \
              -lc 'qemu-arm -cpu arm926 /tmp/saltbox-facts --version'
          )"
          if [ "$version_output" != "$VERSION" ]; then
            echo "ARMv5 runtime check emitted version '${version_output}', expected '${VERSION}'." >&2
            exit 1
          fi
          output="$(
            docker run --rm \
              --entrypoint sh \
              --volume "${fact_binary}:/tmp/saltbox-facts:ro" \
              "ghcr.io/cross-rs/${TARGET}:0.2.5" \
              -lc 'qemu-arm -cpu arm926 /tmp/saltbox-facts'
          )"
          case "$output" in
            *'"ip":'*) ;;
            *)
              echo "ARMv5 runtime check did not emit the IP fact." >&2
              exit 1
              ;;
          esac

      - name: Prepare binary
        run: |
          cd target/${{ matrix.target }}/release
          BINARY_NAME="saltbox-facts"
          OUTPUT_NAME="saltbox-facts-${{ matrix.arch }}"
          mv ${BINARY_NAME} ${OUTPUT_NAME}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: saltbox-facts-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/saltbox-facts-${{ matrix.arch }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: saltbox-facts-*
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          # Move all binaries to release directory
          for dir in artifacts/saltbox-facts-*; do
            if [ -d "$dir" ]; then
              mv "$dir"/* release/
            fi
          done
          
          # Create legacy name for amd64 if it exists
          if [ -f "release/saltbox-facts-amd64" ]; then
            cp release/saltbox-facts-amd64 release/saltbox-facts
            echo "Created legacy binary: saltbox-facts"
          fi
          
          # List files for verification
          echo "Release files:"
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
