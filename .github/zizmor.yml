rules:
  unpinned-uses:
    config:
      policies:
        # Saltyorg actions are consumed by release tag; every other action is
        # pinned to a commit that Renovate keeps current.
        "saltyorg/*": ref-pin
        "*": hash-pin
  self-repository:
    # Actionlint does not yet understand the `$/` reusable-workflow syntax.
    disable: true
