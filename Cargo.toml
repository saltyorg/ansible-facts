[package]
name = "saltbox-facts"
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.89"
description = "Executable Ansible local facts for Saltbox hosts"
repository = "https://github.com/saltyorg/ansible-facts"
readme = "README.md"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
strip = true
codegen-units = 1
lto = "fat"
panic = "abort"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
reqwest = { version = "0.13.4", features = ["stream"] }
serde_json = "1.0.151"
futures-util = "0.3.33"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "local_paths"
harness = false
